spring.application.name=pharmacy-management
server.port=8080

# Default local runtime uses embedded H2 database so the app works without MySQL installed.
# MySQL configuration can be enabled later by switching to the mysql profile.
spring.datasource.url=jdbc:h2:mem:pharmacy_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.thymeleaf.cache=false
