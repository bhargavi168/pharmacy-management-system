<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">PharmaCare</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/medicines">Medicines</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/billing">Billing</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sales">Sales</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-1">Billing Counter</h2>
                <p class="text-muted mb-0">Process prescription and invoice</p>
            </div>
        </div>

        <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form method="post" action="/billing/checkout">
            <div class="billing-layout">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Search Medicine</label>
                            <input type="text" class="form-control" id="medicineSearch"
                                placeholder="Search by name or brand">
                        </div>
                        <div class="table-responsive" style="max-height: 420px; overflow-y: auto;">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th>Expiry</th>
                                        <th>Add</th>
                                    </tr>
                                </thead>
                                <tbody id="medicineTableBody">
                                    <tr th:each="medicine : ${medicines}">
                                        <td th:text="${medicine.name}">Medicine</td>
                                        <td th:text="${'₹' + #numbers.formatDecimal(medicine.unitPrice, 1, 2)}">₹0.00
                                        </td>
                                        <td>
                                            <span th:if="${medicine.stockQuantity < 10}"
                                                class="badge bg-warning text-dark"
                                                th:text="${medicine.stockQuantity}">0</span>
                                            <span th:unless="${medicine.stockQuantity < 10}" class="badge bg-success"
                                                th:text="${medicine.stockQuantity}">0</span>
                                        </td>
                                        <td>
                                            <span th:if="${medicine.expired}" class="badge badge-expired"
                                                th:text="${#temporals.format(medicine.expiryDate, 'yyyy-MM-dd')}">2024-01-01</span>
                                            <span th:unless="${medicine.expired}"
                                                th:text="${#temporals.format(medicine.expiryDate, 'yyyy-MM-dd')}">2024-01-01</span>
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-sm btn-primary add-to-cart"
                                                th:data-id="${medicine.id}" th:data-name="${medicine.name}"
                                                th:data-price="${medicine.unitPrice}"
                                                th:data-stock="${medicine.stockQuantity}">Add</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3">Customer Details</h5>
                        <div class="mb-3">
                            <label class="form-label">Customer Name</label>
                            <input type="text" class="form-control" name="customerName" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="customerPhone" required>
                        </div>

                        <h5 class="mb-3">Cart</h5>
                        <div id="cartItems">
                            <div class="text-muted">No medicines added yet.</div>
                        </div>

                        <div class="mt-4 border-top pt-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <strong id="subtotalDisplay">₹0.00</strong>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Tax (10%)</span>
                                <strong id="taxDisplay">₹0.00</strong>
                            </div>
                            <div class="d-flex justify-content-between mt-3 pt-2 border-top">
                                <span>Total</span>
                                <strong id="totalDisplay">₹0.00</strong>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mt-4">Print Bill</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script th:src="@{/js/billing.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
