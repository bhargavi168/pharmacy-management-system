<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Medicine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">PharmaCare</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/medicines">Medicines</a></li>
                    <li class="nav-item"><a class="nav-link" href="/billing">Billing</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sales">Sales</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-4" th:text="${medicine.id != null} ? 'Edit Medicine' : 'Add Medicine'">Add
                            Medicine</h3>
                        <form th:action="@{/medicines/save}" th:object="${medicine}" method="post">
                            <input type="hidden" th:field="*{id}">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" th:field="*{name}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Brand</label>
                                    <input type="text" class="form-control" th:field="*{brand}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Category</label>
                                    <select class="form-select" th:field="*{category}" required>
                                        <option value="">Select Category</option>
                                        <option value="Pain Relief">Pain Relief</option>
                                        <option value="Antibiotic">Antibiotic</option>
                                        <option value="Allergy">Allergy</option>
                                        <option value="Supplement">Supplement</option>
                                        <option value="Digestive">Digestive</option>
                                        <option value="Diabetes">Diabetes</option>
                                        <option value="Respiratory">Respiratory</option>
                                        <option value="Thyroid">Thyroid</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Unit Price</label>
                                    <input type="number" step="0.01" min="0" class="form-control"
                                        th:field="*{unitPrice}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Stock Quantity</label>
                                    <input type="number" min="0" class="form-control" th:field="*{stockQuantity}"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Expiry Date</label>
                                    <input type="date" class="form-control" th:field="*{expiryDate}" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="/medicines" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Save Medicine</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
