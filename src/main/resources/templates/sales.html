<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">PharmaCare</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/medicines">Medicines</a></li>
                    <li class="nav-item"><a class="nav-link" href="/billing">Billing</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/sales">Sales</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-1">Sales</h2>
                <p class="text-muted mb-0">Invoice and transaction history</p>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Invoice ID</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sale : ${sales}">
                            <td th:text="${sale.saleId}">1</td>
                            <td th:text="${sale.customer.name}">Client</td>
                            <td th:text="${sale.customer.phone}">0000000000</td>
                            <td th:text="${#temporals.format(sale.saleDate, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                            <td th:text="${'₹' + #numbers.formatDecimal(sale.totalAmount, 1, 2)}">₹0.00</td>
                            <td><a th:href="@{/invoice/{id}(id=${sale.saleId})}"
                                    class="btn btn-sm btn-outline-primary">View</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
