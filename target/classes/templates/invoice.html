<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container py-5">
        <div class="invoice-box mx-auto" style="max-width: 900px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="mb-1">PharmaCare</h3>
                    <div class="text-muted">Medical Inventory & Billing</div>
                </div>
                <div class="text-end">
                    <strong>Invoice #</strong> <span th:text="${sale.saleId}">1</span>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <strong>Customer:</strong> <span th:text="${sale.customer.name}">Customer</span><br>
                    <strong>Phone:</strong> <span th:text="${sale.customer.phone}">0000000000</span>
                </div>
                <div class="col-md-6 text-md-end">
                    <strong>Date:</strong> <span
                        th:text="${#temporals.format(sale.saleDate, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                </div>
            </div>

            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Medicine</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${sale.saleItems}">
                        <td th:text="${item.medicine.name}">Medicine</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="${'₹' + #numbers.formatDecimal(item.medicine.unitPrice, 1, 2)}">₹0.00</td>
                        <td th:text="${'₹' + #numbers.formatDecimal(item.subtotal, 1, 2)}">₹0.00</td>
                    </tr>
                </tbody>
            </table>

            <div class="mt-4 d-flex justify-content-end">
                <div style="width: 280px;">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <strong
                            th:text="${'₹' + #numbers.formatDecimal(sale.totalAmount.subtract(sale.totalAmount.multiply(T(java.math.BigDecimal).valueOf(0.10))), 1, 2)}">₹0.00</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax (10%)</span>
                        <strong
                            th:text="${'₹' + #numbers.formatDecimal(sale.totalAmount.multiply(T(java.math.BigDecimal).valueOf(0.10)), 1, 2)}">₹0.00</strong>
                    </div>
                    <div class="d-flex justify-content-between border-top pt-2">
                        <span>Total</span>
                        <strong th:text="${'₹' + #numbers.formatDecimal(sale.totalAmount, 1, 2)}">₹0.00</strong>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button class="btn btn-primary" onclick="window.print()">Print</button>
                <a href="/sales" class="btn btn-outline-secondary ms-2">Back to Sales</a>
            </div>
        </div>
    </div>
</body>

</html>
