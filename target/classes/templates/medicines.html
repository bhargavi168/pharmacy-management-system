<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Medicines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">PharmaCare</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/medicines">Medicines</a></li>
                    <li class="nav-item"><a class="nav-link" href="/billing">Billing</a></li>
                    <li class="nav-item"><a class="nav-link" href="/sales">Sales</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-1">Medicines</h2>
                <p class="text-muted mb-0">Manage stock and inventory</p>
            </div>
            <a href="/medicines/add" class="btn btn-primary">Add Medicine</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form method="get" action="/medicines" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Search</label>
                        <input type="text" class="form-control" name="name" th:value="${name}"
                            placeholder="Medicine name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="category">
                            <option value="">All</option>
                            <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"
                                th:selected="${category == selectedCategory}">Category</option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-outline-primary">Filter</button>
                        <a href="/medicines" class="btn btn-outline-secondary">Clear</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Brand</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Expiry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="medicine : ${medicines}">
                            <td th:text="${medicine.name}">Name</td>
                            <td th:text="${medicine.brand}">Brand</td>
                            <td th:text="${medicine.category}">Category</td>
                            <td th:text="${'₹' + #numbers.formatDecimal(medicine.unitPrice, 1, 2)}">₹0.00</td>
                            <td>
                                <span
                                    th:classappend="${medicine.stockQuantity < 10} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                                    th:text="${medicine.stockQuantity}">0</span>
                            </td>
                            <td>
                                <span th:if="${medicine.expired}" class="badge badge-expired"
                                    th:text="${#temporals.format(medicine.expiryDate, 'yyyy-MM-dd')}">2024-01-01</span>
                                <span th:unless="${medicine.expired}" class="badge bg-light text-dark"
                                    th:text="${#temporals.format(medicine.expiryDate, 'yyyy-MM-dd')}">2024-01-01</span>
                            </td>
                            <td>
                                <a th:href="@{/medicines/edit/{id}(id=${medicine.id})}"
                                    class="btn btn-sm btn-outline-primary me-2">Edit</a>
                                <a th:href="@{/medicines/delete/{id}(id=${medicine.id})}"
                                    class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
